<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль</title>
    <link rel="stylesheet" href="/css/profile.css">
    <link rel="stylesheet" href="/css/modal.css">
    <script src="/js/auth.js" defer></script>
    <script src="/js/modal.js" defer></script>
    <script src="/js/profile.js" defer></script>
</head>
<body>
     <header>
        <div class="logoNavButton">
            <img src="/images/Ramen no Jutsu.svg" width="180px" height="34px" alt="лого">
            <div class="nav">
                <a href="index.html"><p class="navtext">Главная</p></a>
                <a href="index.html#menu"><p class="navtext">Меню</p></a>
                <a href="index.html#reviews"><p class="navtext">Отзывы</p></a>
                <div class="boking">
                    <button class="bookingText" onclick="document.location='booking.html'">Забронировать</button>
                </div>
            </div>
            <a href="profile.html"><img src="/images/Group.png" width="32px" id="prof"></a>
        </div>
        <hr>
    </header>

    <div class="profileBlock">
        <div class="content">
            <p class="profiletext">профиль</p>
            <div class="infoblock">
                <div class="information">
                    <img src="/images/profle.svg" width="249px" id="proficon">
                    <div class="infotext">
                        <p class="login" id="profile-login">Логин</p>
                        <p class="number" id="profile-phone">+7 912 345 67 89</p>
                    </div>
                </div>
                <div style="display: flex; flex-direction: column; gap: 20px;">
                    <button class="logout" id="review-btn" style="background-color: #E8CF2B; color: #100B07;">Оставить отзыв</button>
                    <button class="logout" id="admin-btn" style="display: none; background-color: #F57E02; color: #100B07;" onclick="document.location='admin.html'">Админ-панель</button>
                    <button class="logout" id="logout-btn">Выйти</button>
                </div>
            </div>
            <div class="blockbooking">
                <div class="bookinginfo">
                    <p class="textbook">Ваши бронирования</p>
                    <div class="listbooking" id="bookings-list"></div>
                </div>
            </div>
        </div>
    </div>
    <hr>

    <div class="modal-overlay" id="review-overlay"></div>
    <div class="modal_auth review-modal-window" id="review-modal" style="display: none;">
        <button class="modal-close" id="close-review">×</button>
        <div class="macontent" style="max-width: 500px;">
            <p class="headerA">Оставить отзыв</p>
            <div class="fields">
                
                <div class="field-group">
                    <div style="flex: 2;">
                        <label class="fieldText" style="margin-bottom: 10px; display: block;">Ваше имя:</label>
                        <input type="text" id="review-name" class="review-input" placeholder="Например: Марина">
                    </div>
                    <div style="flex: 1;">
                        <label class="fieldText" style="margin-bottom: 10px; display: block;">Возраст:</label>
                        <input type="text" id="review-age" class="review-input" placeholder="25">
                    </div>
                </div>

                <label class="fieldText" style="margin-bottom: 15px; display: block;">Оценка:</label>
                <div style="display: flex; gap: 10px; margin-bottom: 20px;" id="stars-container"></div>

                <label class="fieldText1" for="review-text" style="margin-left: 0; margin-bottom: 15px; display: block;">Текст отзыва:</label>
                <textarea class="review-textarea" id="review-text" placeholder="Напишите ваш отзыв здесь..."></textarea>
            </div>
            <div class="buttonMot" style="margin-top: 20px;">
                <button class="signin" id="submit-review" style="width: 100%;">Отправить</button>
            </div>
        </div>
    </div>

    <footer><img src="/images/Ramen no Jutsu.svg" alt="лого" width="270px"></footer>

</body>
</html>
